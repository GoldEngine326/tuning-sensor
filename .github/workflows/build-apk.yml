name: Build and Release APK

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Mock Keystore & Config if needed
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          touch .env || true
          echo "" > .env

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Rename APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TuningSensor-latest.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TuningSensor-latest.apk
          draft: false
          prerelease: false
          generate_release_notes: true
