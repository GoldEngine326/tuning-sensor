name: Build and Release APK

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare build environment and keystore
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > debug.keystore
          cp debug.keystore ~/.android/debug.keystore

          touch .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          cp .env app/.env || true

      - name: Extract Tag Version and Inject into BuildConfig
        id: get_version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          CLEAN_VER="${TAG_NAME#v}"
          CLEAN_VER="${CLEAN_VER#V}"
          echo "Building version: $CLEAN_VER"
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          sed -i -E "s/versionName = \".*\"/versionName = \"$CLEAN_VER\"/g" app/build.gradle.kts
          CODE=$(echo "$CLEAN_VER" | tr -cd '0-9')
          if [ ! -z "$CODE" ]; then
            sed -i -E "s/versionCode = [0-9]+/versionCode = $CODE/g" app/build.gradle.kts
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug -x test -x lint --no-configuration-cache

      - name: Rename APK Asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TuningSensor-latest.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TuningSensor-latest.apk
          draft: false
          prerelease: false
          generate_release_notes: true
